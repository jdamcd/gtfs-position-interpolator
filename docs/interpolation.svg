<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <title>How a vehicle is moved along one hop between two stops</title>
  <desc>Top: the track between stop A and stop B, with the vehicle halfway along. Bottom: speed against time. The vehicle accelerates over the ramp, cruises, and brakes over the ramp to stop at B at the predicted arrival. When the predicted arrival moves later, it eases to a lower cruising speed from where it is, and arrives at the new time.</desc>

  <g fill="#6e7781">
    <text x="90" y="24" text-anchor="middle">Stop A</text>
    <text x="670" y="24" text-anchor="middle">Stop B</text>
    <text x="380" y="88" text-anchor="middle">where the vehicle is when the prediction changes</text>
  </g>
  <line x1="98" y1="60" x2="662" y2="60" stroke="#6e7781" stroke-width="4" stroke-linecap="round"/>
  <circle cx="90" cy="60" r="7" fill="none" stroke="#6e7781" stroke-width="2.5"/>
  <circle cx="670" cy="60" r="7" fill="none" stroke="#6e7781" stroke-width="2.5"/>
  <path d="M394 60 l-9 -6 v12 z" fill="#2f81f7"/>
  <circle cx="380" cy="60" r="8" fill="#2f81f7"/>

  <g stroke="#6e7781" stroke-width="1.5" fill="none">
    <path d="M90 130 V330 H712"/>
    <path d="M86 137 l4 -8 l4 8 M705 326 l8 4 l-8 4"/>
  </g>
  <g fill="#6e7781">
    <text x="78" y="230" text-anchor="middle" transform="rotate(-90 78 230)">speed</text>
    <text x="722" y="334">time</text>
  </g>

  <line x1="330" y1="330" x2="330" y2="172" stroke="#6e7781" stroke-width="1" stroke-dasharray="3 4"/>
  <path d="M90 330 L170 190 H330" fill="none" stroke="#2f81f7" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M330 190 H490 L570 330" fill="none" stroke="#2f81f7" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <path d="M330 190 L410 243.85 H590 L670 330" fill="none" stroke="#d4720b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="330" cy="190" r="4.5" fill="#2f81f7"/>

  <g stroke="#6e7781" stroke-width="1" fill="none">
    <path d="M90 341 V347 M90 344 H170 M170 341 V347"/>
    <path d="M590 341 V347 M590 344 H670 M670 341 V347"/>
  </g>
  <g fill="#6e7781" text-anchor="middle">
    <text x="130" y="360">ramp</text>
    <text x="630" y="360">ramp</text>
    <text x="90" y="382">leaves A</text>
    <text x="330" y="382">prediction changes</text>
    <text x="552" y="382">predicted arrival</text>
    <text x="676" y="382">new arrival</text>
  </g>
  <g stroke="#6e7781" stroke-width="1">
    <line x1="330" y1="330" x2="330" y2="369"/>
    <line x1="570" y1="330" x2="570" y2="369"/>
    <line x1="670" y1="347" x2="670" y2="369"/>
  </g>

  <g fill="#6e7781">
    <line x1="112" y1="146" x2="142" y2="146" stroke="#2f81f7" stroke-width="3" stroke-linecap="round"/>
    <text x="150" y="150">timed to stop at B at the predicted arrival</text>
    <line x1="430" y1="146" x2="460" y2="146" stroke="#d4720b" stroke-width="3" stroke-linecap="round"/>
    <text x="468" y="150">arrival slipping; slow with no jump</text>
  </g>
</svg>
