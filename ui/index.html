<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#292929" media="(prefers-color-scheme: dark)">
<title>Vehicle positions</title>
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <header>
    <h1>Vehicle positions</h1>
    <label class="switch">Smoothing <input id="smooth" type="checkbox" role="switch" checked title="Glide trains between the positions in the feed" autocomplete="off"></label>
  </header>
  <dl id="stats">
    <dt><label for="routes">Routes</label></dt>
    <dd><input id="routes" type="text" placeholder="all, or a list of IDs" title="Route IDs separated by commas" autocomplete="off" spellcheck="false"></dd>
    <dt>Request</dt><dd id="stat-url">-</dd>
    <dt>Response</dt><dd id="stat-response">-</dd>
    <dt>Vehicles</dt><dd id="stat-count">-</dd>
    <dt>Status</dt>
    <dd>
      <table id="status-counts">
        <tr><th>In transit</th><th>Arriving</th><th>Stopped</th></tr>
        <tr><td data-status="IN_TRANSIT_TO">-</td><td data-status="INCOMING_AT">-</td><td data-status="STOPPED_AT">-</td></tr>
      </table>
    </dd>
  </dl>
  <p id="error" hidden></p>
  <section id="selected" hidden>
    <h2><span id="sel-badge" class="badge"></span><span id="sel-trip"></span><button id="sel-zoom" type="button" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10 14 14"/></svg></button></h2>
    <dl>
      <dt>Entity</dt><dd id="sel-id"></dd>
      <dt>Status</dt><dd id="sel-status"></dd>
      <dt>Position</dt><dd id="sel-position"></dd>
      <dt>Bearing</dt><dd><span id="sel-arrow" hidden><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1 11 11 6 8.5 1 11Z"/></svg></span><span id="sel-bearing"></span></dd>
      <dt>Timestamp</dt><dd id="sel-timestamp"></dd>
    </dl>
  </section>
</aside>
<script type="module" src="/src/main.js"></script>
</body>
</html>
